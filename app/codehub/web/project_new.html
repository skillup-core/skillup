<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Project - CodeHub</title>
    <script src="/common/script/appinit.js" onerror="this.onerror=null; this.src='../../../../web/common/script/appinit.js';"></script>
</head>
<body>
    <link rel="stylesheet" href="codehub.css" onerror="this.onerror=null; this.href='/app/codehub/web/codehub.css';">
    <script src="codehub.js" onerror="this.onerror=null; this.src='/app/codehub/web/codehub.js';"></script>

    <div class="content-container">
        <div class="ch-page">

            <div class="ch-topbar">
                <a class="ch-file-link" style="cursor:pointer;font-size:14px;margin-right:10px" onclick="goBack()">
                    <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:var(--accent-text)"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </a>
                <span class="ch-topbar-title" id="page-title"></span>
            </div>

            <div style="max-width:520px">

                <div style="margin-bottom:14px">
                    <label style="display:block;font-size:13px;font-weight:600;margin-bottom:4px" id="lbl-name"></label>
                    <input type="text" id="inp-name" class="form-control" style="font-size:13px"
                           placeholder="my-project">
                </div>

                <div style="margin-bottom:14px">
                    <label style="display:block;font-size:13px;font-weight:600;margin-bottom:4px" id="lbl-desc"></label>
                    <input type="text" id="inp-desc" class="form-control" style="font-size:13px">
                </div>

                <div style="display:flex">
                    <button class="btn btn-primary" id="btn-create" onclick="createProject()"></button>
                    <button class="btn btn-secondary" id="btn-cancel" onclick="goBack()" style="margin-left:8px"></button>
                </div>

            </div>
        </div>
    </div>

    <script>
    let langReady = false;

    function onPageLoad() {
        setTimeout(function() {
            if (!langReady) { langReady = true; applyTexts(); }
        }, 300);
    }

    function onLanguageSet(changed) {
        if (!langReady) {
            langReady = true;
            applyTexts();
        } else if (changed) {
            applyTexts();
        }
    }

    function applyTexts() {
        document.getElementById('page-title').textContent = t('newProject');
        document.getElementById('lbl-name').textContent = t('projectName');
        document.getElementById('lbl-desc').textContent = t('description');
        document.getElementById('btn-create').textContent = t('create');
        document.getElementById('btn-cancel').textContent = t('cancel');
    }

    function showError(msg) {
        window.parent.showToast(msg, { type: 'err' });
    }

    async function createProject() {
        const name = document.getElementById('inp-name').value.trim();
        const description = document.getElementById('inp-desc').value.trim();

        if (!name) { showError(t('nameRequired')); return; }
        if (!/^[A-Za-z0-9_\-]+$/.test(name)) { showError(t('nameInvalid')); return; }

        const btn = document.getElementById('btn-create');
        btn.disabled = true;
        btn.textContent = t('loading');

        const result = await apiCall('create_project', { name, description, members: [] });
        btn.disabled = false;
        btn.textContent = t('create');

        if (result.success) {
            navigateTo('project.html?id=' + result.project_id);
        } else {
            showError(result.error || t('error'));
        }
    }

    function goBack() {
        navigateTo('project_list.html');
    }
    </script>
</body>
</html>
