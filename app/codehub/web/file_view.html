<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File - CodeHub</title>
    <script src="/common/script/appinit.js" onerror="this.onerror=null; this.src='../../../../web/common/script/appinit.js';"></script>
</head>
<body>
    <link rel="stylesheet" href="codehub.css" onerror="this.onerror=null; this.href='/app/codehub/web/codehub.css';">
    <script src="codehub.js" onerror="this.onerror=null; this.src='/app/codehub/web/codehub.js';"></script>
    <script src="/common/jsdiff/5.x/diff.min.js" onerror="this.onerror=null; this.src='../../../../web/common/jsdiff/5.x/diff.min.js';"></script>
    <link  rel="stylesheet" href="/common/codemirror/5.65.16/codemirror.min.css"  onerror="this.onerror=null; this.href='../../../../web/common/codemirror/5.65.16/codemirror.min.css';">
    <link  rel="stylesheet" href="/common/codemirror/5.65.16/theme/dracula.min.css" onerror="this.onerror=null; this.href='../../../../web/common/codemirror/5.65.16/theme/dracula.min.css';">
    <link  rel="stylesheet" href="/common/codemirror/5.65.16/theme/eclipse.min.css" onerror="this.onerror=null; this.href='../../../../web/common/codemirror/5.65.16/theme/eclipse.min.css';">
    <script src="/common/codemirror/5.65.16/codemirror.min.js" onerror="this.onerror=null; this.src='../../../../web/common/codemirror/5.65.16/codemirror.min.js';"></script>
    <script src="/common/codemirror/5.65.16/mode/scheme/scheme.min.js"      onerror="this.onerror=null; this.src='../../../../web/common/codemirror/5.65.16/mode/scheme/scheme.min.js';"></script>
    <script src="/common/codemirror/5.65.16/mode/python/python.min.js"      onerror="this.onerror=null; this.src='../../../../web/common/codemirror/5.65.16/mode/python/python.min.js';"></script>
    <script src="/common/codemirror/5.65.16/mode/javascript/javascript.min.js" onerror="this.onerror=null; this.src='../../../../web/common/codemirror/5.65.16/mode/javascript/javascript.min.js';"></script>
    <script src="/common/codemirror/5.65.16/mode/css/css.min.js"            onerror="this.onerror=null; this.src='../../../../web/common/codemirror/5.65.16/mode/css/css.min.js';"></script>
    <script src="/common/codemirror/5.65.16/mode/xml/xml.min.js"            onerror="this.onerror=null; this.src='../../../../web/common/codemirror/5.65.16/mode/xml/xml.min.js';"></script>
    <script src="/common/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js" onerror="this.onerror=null; this.src='../../../../web/common/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js';"></script>
    <script src="/common/codemirror/5.65.16/mode/markdown/markdown.min.js"  onerror="this.onerror=null; this.src='../../../../web/common/codemirror/5.65.16/mode/markdown/markdown.min.js';"></script>

    <div class="content-container">
        <div class="ch-page" style="max-width:none">

            <div class="ch-topbar">
                <a class="ch-file-link" style="cursor:pointer;font-size:14px;margin-right:10px" id="back-link">
                    <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:var(--accent-text)"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </a>
                <span class="ch-topbar-title" id="file-title" style="font-size:14px;font-family:monospace"></span>
            </div>

            <div id="loading-msg" style="font-size:13px;color:var(--text-secondary);padding:10px 0"></div>

            <!-- mode tabs: shown only when multiple modes are available -->
            <div class="ch-view-tabs" id="view-tabs" style="display:none">
                <button class="ch-view-tab" id="tab-deployed" onclick="switchMode('deployed')"></button>
                <button class="ch-view-tab" id="tab-local"    onclick="switchMode('local')"></button>
                <button class="ch-view-tab" id="tab-diff"     onclick="switchMode('diff')"></button>
            </div>

            <div id="code-block" style="display:none"></div>
            <div id="diff-area" style="display:none">
                <div id="diff-view"></div>
            </div>

        </div>
    </div>

    <div id="diff-nav" class="ch-diff-nav" style="display:none">
        <button class="ch-diff-nav-btn" id="diff-nav-prev" onclick="diffNavMove(-1)">
            <svg viewBox="0 0 24 24"><path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/></svg>
        </button>
        <button class="ch-diff-nav-btn" id="diff-nav-next" onclick="diffNavMove(1)">
            <svg viewBox="0 0 24 24"><path d="M12 16l-6-6 1.41-1.41L12 13.17l4.59-4.58L18 10z"/></svg>
        </button>
    </div>

    <script>
    // ── state ──────────────────────────────────────────────────────────────
    let projectId = null;
    let filePath   = null;
    let fileStatus = null;   // 'modified'|'added'|'untracked'|'deleted'|'missing'|'unmodified'|null
    let viewRevision = null; // non-null = read-only view at that revision
    let revBefore = null;    // non-null = rev-pair diff mode (before revision)
    let revAfter  = null;    // non-null = rev-pair diff mode (after revision)
    let backUrl   = null;    // non-null = custom back navigation URL
    let currentMode = null;  // 'deployed'|'local'|'diff'
    let cache = {};          // {deployed: {content,encoding}|null, local: {content,encoding}|null}
    let cmInstance = null;   // CodeMirror instance (created once, reused)
    let diffSplitRatio = 50; // left column width % for diff view (10-90)

    function _cmTheme() {
        try {
            const sel = window.parent.document.getElementById('theme-select');
            if (sel && sel.value === 'white') return 'eclipse';
        } catch (e) {}
        return 'dracula';
    }

    function _modeForFile(name) {
        const ext = (name || '').split('.').pop().toLowerCase();
        const map = {
            'il': 'scheme', 'ils': 'scheme', 'cdf': 'scheme', 'ocn': 'scheme',
            'py': 'python',
            'js': 'javascript', 'json': 'javascript',
            'css': 'css',
            'html': 'htmlmixed', 'htm': 'htmlmixed',
            'xml': 'xml', 'svg': 'xml',
            'md': 'markdown', 'markdown': 'markdown',
        };
        return map[ext] || null;
    }

    function _showInCM(text) {
        const container = document.getElementById('code-block');
        container.style.display = '';
        if (!cmInstance) {
            cmInstance = CodeMirror(container, {
                value: text,
                mode: _modeForFile(filePath),
                theme: _cmTheme(),
                lineNumbers: true,
                readOnly: 'nocursor',
                lineWrapping: false,
                viewportMargin: Infinity,
            });
        } else {
            cmInstance.setOption('mode', _modeForFile(filePath));
            cmInstance.setOption('theme', _cmTheme());
            cmInstance.setValue(text);
        }
        cmInstance.refresh();
    }

    // ── init ───────────────────────────────────────────────────────────────
    let langReady = false;
    let contentReady = false;

    function onPageLoad() {
        const params = new URLSearchParams(window.location.search);
        projectId    = params.get('id');
        filePath     = params.get('path') || '';
        fileStatus   = params.get('status') || null;
        viewRevision = params.get('rev') || null;
        revBefore    = params.get('rev_before') || null;
        revAfter     = params.get('rev_after')  || null;
        backUrl      = params.get('back_url')   || null;

        document.getElementById('file-title').textContent = filePath.split('/').pop();
        document.getElementById('back-link').onclick = () => {
            if (backUrl) {
                navigateTo(decodeURIComponent(backUrl));
                return;
            }
            const parentPath = filePath.includes('/')
                ? filePath.substring(0, filePath.lastIndexOf('/'))
                : '';
            let url = 'project.html?id=' + projectId;
            if (parentPath) url += '&path=' + encodeURIComponent(parentPath);
            if (viewRevision) url += '&rev=' + viewRevision;
            navigateTo(url);
        };

        if (revBefore !== null || revAfter !== null) {
            // Rev-pair diff mode: show diff between two revisions
            setupRevPairTabs();
            loadAndRender(currentMode).then(function() {
                contentReady = true;
                maybeShowTabs();
            });
        } else if (viewRevision) {
            // Rev mode: no tabs, just fetch and show
            loadRevMode().then(function() {
                contentReady = true;
                maybeShowTabs();
            });
        } else {
            setupTabs();
            loadAndRender(currentMode).then(function() {
                contentReady = true;
                maybeShowTabs();
            });
        }

        // Fall back after 300ms if setLanguage never arrives.
        setTimeout(function() {
            if (!langReady) { langReady = true; applyTexts(); maybeShowTabs(); }
        }, 300);
    }

    function onLanguageSet(changed) {
        if (!langReady) {
            langReady = true;
            applyTexts();
            maybeShowTabs();
        } else if (changed) {
            applyTexts();
        }
    }

    function applyTexts() {
        document.getElementById('tab-deployed').textContent = t('viewDeployed');
        document.getElementById('tab-local').textContent    = t('viewLocal');
        document.getElementById('tab-diff').textContent     = t('viewDiff');
        document.getElementById('loading-msg').textContent  = t('loading');
    }

    function maybeShowTabs() {
        if (!langReady || !contentReady) return;
        var tabsEl = document.getElementById('view-tabs');
        if (tabsEl._multiMode) tabsEl.style.display = '';
    }

    // ── rev mode (read-only at specific revision) ───────────────────────────
    async function loadRevMode() {
        document.getElementById('loading-msg').style.display = '';
        document.getElementById('code-block').style.display = 'none';

        const result = await apiCall('svn_cat', {
            project_id: projectId,
            path: filePath,
            revision: viewRevision,
        });
        document.getElementById('loading-msg').style.display = 'none';

        if (!result.success) {
            window.parent.showToast(result.error || t('error'), { type: 'err' });
            return;
        }
        if (result.encoding === 'utf8') {
            _showInCM(result.content);
        } else {
            const block = document.getElementById('code-block');
            block.textContent = t('binaryFile') + '\n' + result.content;
            block.style.display = '';
        }
    }

    // ── tab setup ───────────────────────────────────────────────────────────
    function setupTabs() {
        const s = fileStatus;
        // Which modes are valid for this status?
        // modified           -> deployed, local, diff  (default: diff)
        // added / untracked  -> local only
        // deleted / missing  -> deployed only
        // unmodified / null  -> deployed only (HEAD == local)
        const hasDeployed = (s !== 'added' && s !== 'untracked');
        const hasLocal    = (s !== 'deleted' && s !== 'missing');
        const hasDiff     = (s === 'modified');

        document.getElementById('tab-deployed').style.display = hasDeployed ? '' : 'none';
        document.getElementById('tab-local').style.display    = hasLocal    ? '' : 'none';
        document.getElementById('tab-diff').style.display     = hasDiff     ? '' : 'none';

        const multiMode = [hasDeployed, hasLocal, hasDiff].filter(Boolean).length > 1;
        // Store multiMode flag; actual display is deferred to showTabs() to avoid text flicker.
        document.getElementById('view-tabs')._multiMode = multiMode;
        // Keep view-tabs hidden until text is ready (showTabs will reveal it).
        document.getElementById('view-tabs').style.display = 'none';

        if (hasDiff)          currentMode = 'diff';
        else if (hasLocal)    currentMode = 'local';
        else                  currentMode = 'deployed';

        setActiveTab(currentMode);
    }

    function setActiveTab(mode) {
        ['deployed', 'local', 'diff'].forEach(m => {
            document.getElementById('tab-' + m).classList.toggle('active', m === mode);
        });
    }

    async function switchMode(mode) {
        if (mode === currentMode) return;
        currentMode = mode;
        setActiveTab(mode);
        await loadAndRender(mode);
    }

    // ── fetch + render ──────────────────────────────────────────────────────
    async function loadAndRender(mode) {
        document.getElementById('loading-msg').style.display = '';
        document.getElementById('code-block').style.display = 'none';
        document.getElementById('diff-area').style.display  = 'none';
        document.getElementById('diff-nav').style.display   = 'none';

        if (mode === 'diff') {
            const [head, local] = await Promise.all([fetchDeployed(), fetchLocal()]);
            document.getElementById('loading-msg').style.display = 'none';
            renderDiff(head, local);
        } else if (mode === 'local') {
            const local = await fetchLocal();
            document.getElementById('loading-msg').style.display = 'none';
            renderSingle(local, false);
        } else {
            const head = await fetchDeployed();
            document.getElementById('loading-msg').style.display = 'none';
            renderSingle(head, true);
        }
    }

    // ── rev-pair tab setup (revision_detail → diff between two revisions) ────
    function setupRevPairTabs() {
        // revBefore=null means the file was added (no before version)
        // revAfter=null  means the file was deleted (no after version)
        // In rev-pair mode, always hide "배포 버전" and "현재 버전" tabs —
        // only show Diff (when both sides exist) or the single available version.
        const hasDeployed = (revBefore !== null);
        const hasLocal    = (revAfter  !== null);
        const hasDiff     = (hasDeployed && hasLocal);

        document.getElementById('tab-deployed').style.display = 'none';
        document.getElementById('tab-local').style.display    = 'none';
        document.getElementById('tab-diff').style.display     = hasDiff ? '' : 'none';

        document.getElementById('view-tabs')._multiMode = false;
        document.getElementById('view-tabs').style.display = 'none';

        if (hasDiff)       currentMode = 'diff';
        else if (hasLocal) currentMode = 'local';
        else               currentMode = 'deployed';

        setActiveTab(currentMode);
    }

    async function fetchDeployed() {
        if ('deployed' in cache) return cache.deployed;
        const rev = (revBefore !== null) ? revBefore : 'HEAD';
        const result = await apiCall('svn_cat', { project_id: projectId, path: filePath, revision: rev });
        cache.deployed = result.success ? result : null;
        return cache.deployed;
    }

    async function fetchLocal() {
        if ('local' in cache) return cache.local;
        let result;
        if (revAfter !== null) {
            result = await apiCall('svn_cat', { project_id: projectId, path: filePath, revision: revAfter });
        } else {
            result = await apiCall('read_local_file', { project_id: projectId, path: filePath });
        }
        cache.local = result.success ? result : null;
        return cache.local;
    }

    // ── single file render ──────────────────────────────────────────────────
    function renderSingle(data, isDeployed) {
        if (!data) {
            window.parent.showToast(isDeployed ? t('noHeadVersion') : t('noLocalVersion'), { type: 'err' });
            return;
        }
        if (data.encoding === 'utf8') {
            _showInCM(data.content);
        } else {
            const block = document.getElementById('code-block');
            block.textContent = t('binaryFile') + '\n' + data.content;
            block.style.display = '';
        }
    }

    // ── diff render ─────────────────────────────────────────────────────────
    function renderDiff(head, local) {
        const headText  = (head  && head.encoding  === 'utf8') ? head.content  : null;
        const localText = (local && local.encoding === 'utf8') ? local.content : null;

        if (headText === null && localText === null) {
            window.parent.showToast(t('binaryFile'), { type: 'err' });
            return;
        }

        const diffView = document.getElementById('diff-view');
        diffView.innerHTML = '';

        chDiffRender(headText !== null ? headText : '', localText !== null ? localText : '', diffView,
                     { splitRatio: diffSplitRatio, withResizer: true,
                       onRatioChange: function(r) { diffSplitRatio = r; } });

        // Collect changed rows for navigation
        const tbody = diffView.querySelector('tbody');
        diffChangedRows = tbody ? Array.from(tbody.querySelectorAll('tr.removed, tr.added, tr.changed')) : [];
        diffChangeGroups = _buildChangeGroups(diffChangedRows);
        diffNavIndex = -1;

        document.getElementById('diff-area').style.display = 'flex';

        if (diffChangedRows.length > 0) {
            const nav = document.getElementById('diff-nav');
            nav.style.display = 'flex';
            const tabs = document.getElementById('view-tabs');
            const tabsRect = tabs.getBoundingClientRect();
            nav.style.top = (tabsRect.bottom + 8) + 'px';
        } else {
            document.getElementById('diff-nav').style.display = 'none';
        }
    }

    // ── diff navigation ──────────────────────────────────────────────────────
    let diffChangedRows = [];
    let diffChangeGroups = []; // array of arrays: each inner array = contiguous changed tr elements
    let diffNavIndex = -1;

    function _buildChangeGroups(rows) {
        const groups = [];
        let cur = null;
        rows.forEach(function(tr) {
            if (!cur || tr.previousElementSibling !== cur[cur.length - 1]) {
                cur = [tr];
                groups.push(cur);
            } else {
                cur.push(tr);
            }
        });
        return groups;
    }

    function _applyNavHighlight() {
        diffChangedRows.forEach(function(tr) {
            tr.classList.remove('ch-diff-focused', 'ch-diff-focus-first', 'ch-diff-focus-last');
        });
        if (diffNavIndex < 0 || diffNavIndex >= diffChangeGroups.length) return;
        const grp = diffChangeGroups[diffNavIndex];
        grp.forEach(function(tr) { tr.classList.add('ch-diff-focused'); });
        grp[0].classList.add('ch-diff-focus-first');
        grp[grp.length - 1].classList.add('ch-diff-focus-last');
    }

    function diffNavMove(dir) {
        if (diffChangeGroups.length === 0) return;
        diffNavIndex = Math.min(diffChangeGroups.length - 1, Math.max(0, diffNavIndex + dir));
        _applyNavHighlight();
        diffChangeGroups[diffNavIndex][0].scrollIntoView({ block: 'center' });
    }

    // ── theme sync ───────────────────────────────────────────────────────────
    window.addEventListener('message', function(event) {
        if (!event.data || event.data.action !== 'setTheme') return;
        if (cmInstance) {
            cmInstance.setOption('theme', _cmTheme());
        }
    });

</script>
</body>
</html>
