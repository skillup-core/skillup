<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Runner - Skill Form</title>
    <script>
    // Standalone Qt window always starts with white theme to avoid dark flash
    (function() {
        var p = new URLSearchParams(window.location.search);
        if (window.parent === window && p.get('standalone') === '1') {
            var l = document.createElement('link');
            l.rel = 'stylesheet'; l.href = '/common/style/white.css';
            l.setAttribute('data-theme-css', 'true');
            document.head.appendChild(l);
        }
    })();
    </script>
    <script src="/common/script/appinit.js" onerror="this.onerror=null;this.src='../../../../web/common/script/appinit.js';"></script>
    <script src="/common/marked/16.x/marked.min.js" onerror="this.onerror=null;this.src='../../../../desktop/common/marked/16.x/marked.min.js';"></script>
    <link id="hljs-css" rel="stylesheet" href="/common/highlight.js/11.x/styles/github.min.css" onerror="this.onerror=null;this.href='../../../../desktop/common/highlight.js/11.x/styles/github.min.css';">
    <script src="/common/highlight.js/11.x/highlight.min.js" onerror="this.onerror=null;this.src='../../../../desktop/common/highlight.js/11.x/highlight.min.js';"></script>
</head>
<body>
<link rel="stylesheet" href="skillform.css" onerror="this.onerror=null;this.href='/app/skillform/skillform.css';">

<div class="sfr-root">

    <!-- Form area (grid-rendered) -->
    <div class="sfr-form" id="sfr-form"></div>

    <!-- Result area -->
    <div class="sfr-result" id="sfr-result" style="display:none">
        <div class="sfd-props-title">Result</div>
        <pre id="sfr-result-json"></pre>
    </div>

</div>

<script>
// ================================================================
// STATE
// ================================================================
let currentSchema   = null;
let formValues      = {};
let currentRecordId = null;
let _currentLang    = new URLSearchParams(window.location.search).get('lang') || 'en';

// Return the localized value of obj[key], falling back to obj[key] when no locale variant exists.
function _loc(obj, key) {
    const locKey = key + '.' + _currentLang;
    return (obj[locKey] !== undefined) ? obj[locKey] : obj[key];
}

// ================================================================
// RENDER FORM from skillform JSON schema
// ================================================================
function renderForm(schema) {
    currentSchema = schema;
    formValues    = {};
    _boardFields.forEach(b => { if (b._resizeObserver) b._resizeObserver.disconnect(); });
    _boardFields  = [];
    _infoFields   = [];
    _commentLayouts.forEach(c => { if (c.observer) c.observer.disconnect(); });
    _commentLayouts = [];

    // Set window title from docProps
    const formName = _loc(schema.docProps || {}, 'formName') || _loc(schema, 'title') || '';
    if (formName) document.title = formName;

    const formEl = document.getElementById('sfr-form');
    formEl.style.display = 'block';

    // Apply document font size; scale grid proportionally to base size of 14px
    const fontSize = (schema.docProps && schema.docProps.fontSize) || 14;
    const scale = fontSize / 14;
    const rootEl = document.querySelector('.sfr-root');
    rootEl.style.fontSize = fontSize + 'px';
    rootEl.style.setProperty('--runner-font-size', fontSize + 'px');

    // Apply theme override from docProps (default: light)
    const theme = (schema.docProps && schema.docProps.theme) || 'light';
    if (theme !== 'auto') {
        let isLight;
        if (theme === 'invert') {
            // Read desktop theme from parent's #theme-select (desktop.html).
            // Cannot use SkillupTheme.current — runner changes it on every renderForm.
            let desktopTheme = 'default';
            try {
                const sel = window.parent !== window
                    ? window.parent.document.getElementById('theme-select')
                    : null;
                if (sel && sel.value) desktopTheme = sel.value;
            } catch(e) {}
            isLight = (desktopTheme === 'default');
        } else {
            isLight = theme !== 'dark';
        }
        rootEl.classList.toggle('sfr-light', isLight);
        if (window.SkillupTheme) {
            window.SkillupTheme.setTheme(isLight ? 'white' : 'default');
        } else {
            // appinit.js not yet loaded: inject theme link directly
            const existingThemeLink = document.querySelector('link[data-skillform-theme]');
            if (existingThemeLink) existingThemeLink.remove();
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.setAttribute('data-skillform-theme', '1');
            link.href = isLight ? '/common/style/white.css' : '/common/style/default.css';
            document.head.appendChild(link);
        }
        const hljsCss = document.getElementById('hljs-css');
        if (hljsCss) {
            hljsCss.href = isLight
                ? '/common/highlight.js/11.x/styles/github.min.css'
                : '/common/highlight.js/11.x/styles/vs2015.min.css';
        }
    }

    const MARGIN   = 16; // inner margin around the form grid (px)

    const baseRowH = (schema.grid && schema.grid.rowHeight) || 56;
    const baseCellW = (schema.grid && schema.grid.cellW)    || 56;
    const gridRowH = Math.round(baseRowH * scale);
    const cellW    = Math.round(baseCellW * scale);
    const fields   = schema.fields || [];

    // Compute canvas size based on formSize setting
    const docProps = schema.docProps || {};
    const formSize = docProps.formSize || { mode: 'auto', cols: 0, rows: 0 };

    let maxRow = 0, maxCol = 0;
    fields.forEach(f => {
        // comment h in schema is legacy; treat as 1 since layout expands dynamically
        const effectiveH = f.type === 'comment' ? 1 : f.h;
        maxRow = Math.max(maxRow, f.row + effectiveH);
        maxCol = Math.max(maxCol, f.col + f.w);
    });

    // Apply formSize override if in 'set' mode
    if (formSize.mode === 'set') {
        if (formSize.cols > 0) maxCol = formSize.cols;
        if (formSize.rows > 0) maxRow = formSize.rows;
    }

    // Clear previous form content; hide during rebuild to avoid empty-frame flash.
    formEl.style.visibility = 'hidden';
    formEl.innerHTML = '';
    formEl.style.position = 'relative';
    const contentH = maxRow * gridRowH + MARGIN * 2;
    const contentW = maxCol * cellW    + MARGIN * 2;
    formEl.style.height = 'auto';
    formEl.style.width  = 'auto';
    formEl.style.minHeight = contentH + 'px';
    formEl.style.minWidth  = contentW + 'px';

    // Sync iframe height: grow freely, but never shrink below the list-view height.
    try {
        if (window.parent && window.parent !== window && window.parent.desktopModal) {
            var _iframeEl = window.parent.document.querySelector('#desktop-modal-body iframe');
            if (_iframeEl) {
                // List view (no _listSchema) sets the floor; detail view may only grow.
                if (!_listSchema) _iframeHeightFloor = contentH;
                _iframeEl.style.height = Math.max(_iframeHeightFloor, contentH) + 'px';
            }
        }
    } catch(e) {}

    // Enforce minimum window size
    const MIN_W = 300, MIN_H = 150;

    // Render separators first so they appear below other components
    const sorted = [...fields].sort((a, b) => (a.type === 'separator' ? -1 : 0) - (b.type === 'separator' ? -1 : 0));
    sorted.forEach(f => {
        const el = document.createElement('div');
        el.className = 'sfr-field';

        // Separator box: position/size adjusted by center vs edge
        if (f.type === 'separator' && (f.lineType || 'horizontal') === 'box') {
            const isEdge = f.align === 'edge';
            const ox = isEdge ? 0 : cellW / 2;
            const oy = isEdge ? 0 : gridRowH / 2;
            el.style.left   = (f.col * cellW   + ox + MARGIN) + 'px';
            el.style.top    = (f.row * gridRowH + oy + MARGIN) + 'px';
            el.style.width  = (f.w   * cellW   - ox * 2) + 'px';
            el.style.height = (f.h   * gridRowH - oy * 2) + 'px';
            el.style.padding = '0';
        } else if (f.type === 'comment') {
            el.style.left   = MARGIN + 'px';
            el.style.width  = (maxCol * cellW) + 'px';
            el.style.top    = (f.row * gridRowH + MARGIN) + 'px';
            el.style.height = '0px';  // starts at 0; _applyCommentLayout sets real height
            el.style.padding = '0';
        } else if (f.type === 'textarea' && f.markdown !== false && !f.readonly) {
            el.style.left   = (f.col * cellW   + MARGIN) + 'px';
            el.style.width  = (f.w   * cellW) + 'px';
            el.style.top    = (f.row * gridRowH + MARGIN) + 'px';
            el.style.height = (f.h   * gridRowH) + 'px';  // min height; expands with content
        } else {
            el.style.left   = (f.col * cellW   + MARGIN) + 'px';
            el.style.width  = (f.w   * cellW) + 'px';
            el.style.top    = (f.row * gridRowH + MARGIN) + 'px';
            el.style.height = (f.h   * gridRowH) + 'px';
        }

        // Store only the schema row; _applyCommentLayout recomputes top from scratch each time.
        el.dataset.fieldRow  = f.row;
        el.dataset.schemaH   = f.type === 'comment' ? 1 : (f.h || 1);

        f._cellW = cellW;
        el.appendChild(buildFieldWidget(f, gridRowH));
        formEl.appendChild(el);
    });

    // Initialize comment layout after all fields are in the DOM
    const allFieldEls = Array.from(formEl.querySelectorAll('.sfr-field'));
    fields.filter(f => f.type === 'comment').forEach(f => {
        const wrapEl = formEl.querySelector('#sfr-comment-' + f.id);
        if (!wrapEl) return;
        const layout = { fieldDef: f, wrapEl, gridRowH, formEl, allFieldEls, observer: null };
        _commentLayouts.push(layout);
        _applyCommentLayout(layout);
        layout.observer = new ResizeObserver(() => _applyCommentLayout(layout));
        layout.observer.observe(wrapEl);  // wrapEl height is never set, so no resize loop
    });

    // Initialize markdown textarea layout (content-driven height like comment)
    fields.filter(f => f.type === 'textarea' && f.markdown !== false).forEach(f => {
        const wrapEl = formEl.querySelector('#sfr-' + f.id);
        if (!wrapEl) return;
        const fieldEl = wrapEl.closest('.sfr-field');
        if (!fieldEl) return;
        const minH = f.h * gridRowH;
        const layout = { fieldDef: f, wrapEl, gridRowH, formEl, allFieldEls, observer: null, minH };
        _commentLayouts.push(layout);
        const mdPreviewEl = fieldEl.querySelector('.sfr-md-preview');
        const syncMarkdownFieldHeight = () => {
            const labelEl = fieldEl.querySelector('.sfr-label');
            const labelH = labelEl ? labelEl.offsetHeight : 0;
            const labelStyle = labelEl ? getComputedStyle(labelEl) : null;
            const labelMarginTop = labelStyle ? parseFloat(labelStyle.marginTop) || 0 : 0;
            const labelMarginBottom = labelStyle ? parseFloat(labelStyle.marginBottom) || 0 : 0;
            const visibleBodyEl = mdPreviewEl.style.display !== 'none'
                ? mdPreviewEl
                : wrapEl;
            const bodyH = visibleBodyEl ? Math.max(visibleBodyEl.offsetHeight || 0, visibleBodyEl.scrollHeight || 0) : 0;
            // sfr-field has 4px top/bottom padding, and markdown body sits below the label.
            fieldEl.style.height = Math.max(minH, Math.ceil(labelH + labelMarginTop + labelMarginBottom + bodyH + 8)) + 'px';
            _commentLayouts.forEach(cl => _applyCommentLayout(cl));
        };
        layout.observer = new ResizeObserver(() => {
            syncMarkdownFieldHeight();
        });
        layout.observer.observe(mdPreviewEl);
        // Initial layout pass so buttons below are pushed down on first render (edit mode).
        requestAnimationFrame(() => requestAnimationFrame(() => {
            syncMarkdownFieldHeight();
        }));
    });

    document.getElementById('sfr-result').style.display = 'none';
    _applyInfoRecord(null);

    // Reveal after two animation frames so layout is complete before showing.
    requestAnimationFrame(() => requestAnimationFrame(() => { formEl.style.visibility = ''; }));

    // Standalone mode: resize Qt window to fit form content
    if (_isStandaloneMode) {
        _standaloneResizeWindow(Math.max(contentW, MIN_W), Math.max(contentH, MIN_H));
    }
}

function buildFieldWidget(f, rowH) {
    const wrap = document.createElement('div');
    wrap.className = 'sfr-widget';

    if (f.type !== 'separator') {
        wrap.style.fontFamily = (f.font === 'sans')
            ? 'var(--font-sans)' : 'var(--font-mono)';
    }

    if (f.type === 'separator') {
        const lt = f.lineType || 'horizontal';
        const isEdge = f.align === 'edge';
        if (lt === 'vertical') {
            wrap.style.flexDirection = 'row';
            wrap.style.alignItems = isEdge ? 'flex-start' : 'center';
        } else if (lt === 'box') {
            // position/size already handled in sfr-field; widget fills it
        } else {
            wrap.style.justifyContent = isEdge ? 'flex-start' : 'center';
        }
    }

    const label = f.type !== 'separator' && f.type !== 'label' && f.type !== 'button' && f.type !== 'board' && f.type !== 'comment';
    const labelText = f.type === 'info'
        ? ((_SYS_COL_LABELS[_currentLang] || _SYS_COL_LABELS.en)[f.infoField] || f.infoField || '')
        : _loc(f, 'label');
    if (label && labelText) {
        const lbl = document.createElement('label');
        lbl.className = 'sfr-label';
        lbl.textContent = labelText + (f.required ? ' *' : '');
        lbl.htmlFor = 'sfr-' + f.id;
        wrap.appendChild(lbl);
    }

    let input = null;

    switch (f.type) {
        case 'text':
            input = document.createElement('input');
            input.type = 'text';
            input.id = 'sfr-' + f.id;
            if (f.placeholder) input.placeholder = _loc(f, 'placeholder');
            if (f.default)     input.value = f.default;
            if (f.readonly)    input.readOnly = true;
            input.addEventListener('input', () => { formValues[f.id] = input.value; });
            formValues[f.id] = f.default || '';
            break;

        case 'number':
            input = document.createElement('input');
            input.type = 'number';
            input.id = 'sfr-' + f.id;
            if (f.min !== '' && f.min !== undefined) input.min = f.min;
            if (f.max !== '' && f.max !== undefined) input.max = f.max;
            if (f.default !== '') input.value = f.default;
            if (f.readonly) input.readOnly = true;
            input.addEventListener('input', () => { formValues[f.id] = parseFloat(input.value); });
            formValues[f.id] = f.default !== undefined ? Number(f.default) : 0;
            break;

        case 'checkbox':
            input = document.createElement('input');
            input.type = 'checkbox';
            input.id = 'sfr-' + f.id;
            input.checked = (f.default === true || f.default === 'true');
            input.disabled = f.readonly;
            input.addEventListener('change', () => { formValues[f.id] = input.checked; });
            formValues[f.id] = input.checked;
            break;

        case 'toggle':
            input = document.createElement('label');
            input.className = 'sfr-toggle';
            const toggleCb = document.createElement('input');
            toggleCb.type = 'checkbox';
            toggleCb.id = 'sfr-' + f.id;
            toggleCb.checked = (f.default === true || f.default === 'true');
            toggleCb.disabled = f.readonly;
            const slider = document.createElement('span');
            slider.className = 'sfr-toggle-slider';
            input.appendChild(toggleCb);
            input.appendChild(slider);
            toggleCb.addEventListener('change', () => { formValues[f.id] = toggleCb.checked; });
            formValues[f.id] = toggleCb.checked;
            break;

        case 'dropdown': {
            input = document.createElement('select');
            input.id = 'sfr-' + f.id;
            input.disabled = f.readonly;
            const ddLocOpts = _loc(f, 'options');
            const ddDefault = _loc(f, 'default');
            (f.options || []).forEach((opt, i) => {
                const o = document.createElement('option');
                o.value = opt;
                o.textContent = (Array.isArray(ddLocOpts) && ddLocOpts[i] !== undefined) ? ddLocOpts[i] : opt;
                if (opt === ddDefault) o.selected = true;
                input.appendChild(o);
            });
            input.addEventListener('change', () => { formValues[f.id] = input.value; });
            formValues[f.id] = input.value;
            break;
        }

        case 'radio': {
            input = document.createElement('div');
            input.className = 'sfr-radio-group' + (f.inline ? ' sfr-radio-group-inline' : '');
            const radioLocOpts = _loc(f, 'options');
            const radioDefault = _loc(f, 'default');
            (f.options || []).forEach((opt, i) => {
                const optLabel = (Array.isArray(radioLocOpts) && radioLocOpts[i] !== undefined) ? radioLocOpts[i] : opt;
                const radioId = 'sfr-' + f.id + '-' + opt.replace(/\s/g,'_');
                const row = document.createElement('label');
                row.className = 'sfr-radio-row';
                const rb = document.createElement('input');
                rb.type = 'radio';
                rb.name = 'sfr-' + f.id;
                rb.id = radioId;
                rb.value = opt;
                if (opt === radioDefault) { rb.checked = true; formValues[f.id] = opt; }
                rb.disabled = f.readonly;
                rb.addEventListener('change', () => { if (rb.checked) formValues[f.id] = opt; });
                row.appendChild(rb);
                row.appendChild(document.createTextNode(' ' + optLabel));
                input.appendChild(row);
            });
            if (!formValues[f.id] && f.options && f.options.length) {
                formValues[f.id] = f.options[0];
            }
            break;
        }

        case 'textarea':
            if (f.markdown !== false && f.readonly) {
                // Readonly markdown: render as preview-only div, no edit controls.
                const roMdWrap = document.createElement('div');
                roMdWrap.className = 'sfr-md-wrap';
                const roMdPreview = document.createElement('div');
                roMdPreview.className = 'sfr-md-preview';
                roMdPreview.id = 'sfr-' + f.id;
                roMdPreview.style.minHeight = (rowH * (f.h || 1)) + 'px';
                const initVal = f.default || '';
                if (initVal.trim()) {
                    roMdPreview.innerHTML = _cmtRenderMd(initVal);
                    roMdPreview.style.display = '';
                } else {
                    roMdPreview.style.display = 'none';
                }
                roMdPreview._refreshMdPreview = function() {
                    const val = formValues[f.id] || '';
                    if (val.trim()) {
                        roMdPreview.innerHTML = _cmtRenderMd(val);
                        roMdPreview.style.display = '';
                    } else {
                        roMdPreview.style.display = 'none';
                    }
                };
                formValues[f.id] = initVal;
                roMdWrap.appendChild(roMdPreview);
                wrap.appendChild(roMdWrap);
                return wrap;
            }
            if (f.markdown !== false && !f.readonly) {
                const mdWrap = document.createElement('div');
                mdWrap.className = 'sfr-md-wrap';

                const mdTa = document.createElement('textarea');
                mdTa.id = 'sfr-' + f.id;
                mdTa.className = 'sfr-md-textarea';
                mdTa.style.minHeight = (rowH * (f.h || 1)) + 'px';
                if (f.placeholder) mdTa.placeholder = _loc(f, 'placeholder');
                mdTa.value = f.default || '';

                const mdPreview = document.createElement('div');
                mdPreview.className = 'sfr-md-preview';
                mdPreview.style.minHeight = (rowH * (f.h || 1)) + 'px';
                mdPreview.style.display = 'none';

                const mdEditBtn = document.createElement('button');
                mdEditBtn.type = 'button';
                mdEditBtn.className = 'sfr-md-edit-btn';
                mdEditBtn.setAttribute('aria-label', 'Edit');
                mdEditBtn.setAttribute('data-tooltip', _currentLang === 'ko' ? '편집' : 'Edit');
                mdEditBtn.style.display = 'none';
                mdEditBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5a1.414 1.414 0 0 1 2 2L5 13l-3 1 1-3 8.5-8.5z"/></svg>';

                function _switchToEdit() {
                    // Preserve only the markdown body height; fieldEl also includes the label block.
                    const fieldEl = wrap.closest('.sfr-field');
                    if (fieldEl) {
                        const labelEl = fieldEl.querySelector('.sfr-label');
                        const labelH = labelEl ? labelEl.offsetHeight : 0;
                        const labelStyle = labelEl ? getComputedStyle(labelEl) : null;
                        const labelMarginTop = labelStyle ? parseFloat(labelStyle.marginTop) || 0 : 0;
                        const labelMarginBottom = labelStyle ? parseFloat(labelStyle.marginBottom) || 0 : 0;
                        const bodyH = Math.max(mdPreview.offsetHeight || 0, mdPreview.scrollHeight || 0);
                        const availableH = bodyH > 0
                            ? bodyH
                            : Math.max((parseFloat(fieldEl.style.height) || 0) - labelH - labelMarginTop - labelMarginBottom - 8, 0);
                        mdTa.style.height = Math.max(availableH, 40) + 'px';
                    }
                    mdTa.style.display      = '';
                    mdPreview.style.display = 'none';
                    mdEditBtn.style.display = 'none';
                    mdTa.focus({ preventScroll: true });
                    mdTa.scrollTop = 0;
                }

                function _switchToView() {
                    const val = mdTa.value;
                    mdTa.style.height = '';  // clear height set by _switchToEdit
                    if (val.trim() === '') {
                        mdTa.style.display      = '';
                        mdPreview.style.display = 'none';
                        mdEditBtn.style.display = 'none';
                        return;
                    }
                    mdPreview.innerHTML     = _cmtRenderMd(_imgExpand(val));
                    mdTa.style.display      = 'none';
                    mdPreview.style.display = '';
                    mdEditBtn.style.display = '';
                }

                mdTa._refreshMdPreview = function() {
                    _switchToView();
                };

                // imgMap: token -> dataUrl  (session-only; tokens are expanded on submit/render)
                const imgMap = {};
                let imgSeq = 0;

                function _imgExpand(text) {
                    return text.replace(/!\[([^\]]*)\]\(image:(\d+)\)/g, (_, alt, id) => {
                        const data = imgMap[id];
                        return data ? '![' + alt + '](' + data + ')' : '![' + alt + '](image:' + id + ')';
                    });
                }

                function _imgTokenize(text) {
                    return text.replace(/!\[([^\]]*)\]\((data:image\/[^)]+)\)/g, (_, alt, data) => {
                        const id = ++imgSeq;
                        imgMap[id] = data;
                        return '![' + alt + '](image:' + id + ')';
                    });
                }

                function _syncFormValue() {
                    formValues[f.id] = _imgExpand(mdTa.value);
                }

                mdTa.addEventListener('input', () => { _syncFormValue(); });
                mdTa.addEventListener('blur',  () => { _switchToView(); });
                mdEditBtn.addEventListener('click', () => { _switchToEdit(); });

                mdTa.addEventListener('paste', (e) => {
                    const items = e.clipboardData && e.clipboardData.items;
                    if (!items) return;
                    for (let i = 0; i < items.length; i++) {
                        if (!items[i].type.startsWith('image/')) continue;
                        e.preventDefault();
                        const file = items[i].getAsFile();
                        const img = new Image();
                        const url = URL.createObjectURL(file);
                        img.onload = () => {
                            URL.revokeObjectURL(url);
                            const canvas = document.createElement('canvas');
                            canvas.width  = img.naturalWidth;
                            canvas.height = img.naturalHeight;
                            canvas.getContext('2d').drawImage(img, 0, 0);
                            const dataUrl = canvas.toDataURL('image/webp', 0.85);
                            const id = ++imgSeq;
                            imgMap[id] = dataUrl;
                            const token = '![](image:' + id + ')';
                            const start = mdTa.selectionStart;
                            const end   = mdTa.selectionEnd;
                            mdTa.value = mdTa.value.slice(0, start) + token + mdTa.value.slice(end);
                            mdTa.selectionStart = mdTa.selectionEnd = start + token.length;
                            _syncFormValue();
                        };
                        img.src = url;
                        break;
                    }
                });

                const _initVal = _imgTokenize(f.default || '');
                mdTa.value = _initVal;
                formValues[f.id] = f.default || '';

                mdWrap.appendChild(mdPreview);
                mdWrap.appendChild(mdTa);
                mdWrap.appendChild(mdEditBtn);
                wrap.appendChild(mdWrap);

                if ((f.default || '').trim() !== '') {
                    _switchToView();
                } else {
                    _switchToEdit();
                }

                return wrap;
            }
            input = document.createElement('textarea');
            input.id = 'sfr-' + f.id;
            input.rows = f.rows || 3;
            if (f.placeholder) input.placeholder = _loc(f, 'placeholder');
            if (f.default)     input.value = f.default;
            if (f.readonly)    input.readOnly = true;
            input.style.resize = 'none';
            input.style.height = '100%';
            input.addEventListener('input', () => { formValues[f.id] = input.value; });
            formValues[f.id] = f.default || '';
            break;

        case 'file':
            input = document.createElement('div');

        case 'date':
            input = document.createElement('input');
            input.type = 'date';
            input.id = 'sfr-' + f.id;

        case 'color':
            input = document.createElement('input');
            input.type = 'color';

            sl.disabled = f.readonly;
            const slVal = document.createElement('span');

        case 'label': {

            wrap.style.justifyContent = 'flex-end';
            const _boardCmdIconMap = { POST: 'icon-post.svg', MODIFY: 'icon-modify.svg', DELETE: 'icon-delete.svg', LIST: 'icon-list.svg' };
            const _boardCmdIcon = f.boardCommand && _boardCmdIconMap[f.boardCommand];
            if (_boardCmdIcon) {
                input.className = 'sfr-btn sfr-btn-board';

                input.appendChild(document.createTextNode(' ' + (_loc(f, 'label') || f.id)));
            } else {

                input.className = 'sfr-btn ' + (variantMap[f.variant] || 'sfr-btn-primary');

            input.addEventListener('click', async () => {

                const _msgs = {
                    POST:   _currentLang === 'ko' ? '입력하신 내용으로 등록하시겠습니까?' : 'Would you like to submit with the entered content?',

            input.type = 'text';
            if (f.default) input.value = f.default;

    return wrap;
}

function showConfirmDialog(title, text, options) {
    const outer = _findConfirm();
    if (outer) return outer(title, text, options);
    return new Promise(function(resolve) {
        const dialog  = document.getElementById('sfr-confirm-dialog');
        const yesBtn  = document.getElementById('sfr-confirm-yes');
        const noBtn   = document.getElementById('sfr-confirm-no');
        document.getElementById('sfr-confirm-title').textContent = title;
        document.getElementById('sfr-confirm-text').textContent  = text;
        yesBtn.classList.remove('btn-primary', 'btn-danger', 'btn-secondary');
        yesBtn.classList.add((options && options.yesStyle === 'danger') ? 'btn-danger' : (options && options.yesStyle === 'secondary') ? 'btn-secondary' : 'btn-primary');
        const hideCancelBtn = options && options.hideCancelBtn;
        noBtn.style.display = hideCancelBtn ? 'none' : '';
        const lang = _currentLang || 'en';
        yesBtn.textContent = lang === 'ko' ? '확인' : 'Yes';
        noBtn.textContent  = lang === 'ko' ? '취소' : 'No';
        if (options && options.buttons && options.buttons[0]) {
            yesBtn.textContent = options.buttons[0].label || yesBtn.textContent;
            noBtn.style.display = 'none';
        }
        dialog.style.display = 'flex';
        const onYes = () => { dialog.style.display = 'none'; cleanup(); resolve(true); };
        const onNo  = () => { dialog.style.display = 'none'; cleanup(); resolve(false); };
        const onKeydown = (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); if (document.activeElement === noBtn) onNo(); else onYes(); }
            else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); onNo(); }
            else if (e.key === 'Tab') { e.preventDefault(); if (document.activeElement === yesBtn) noBtn.focus(); else yesBtn.focus(); }
        };
        const onBackdrop = (e) => { if (e.target === dialog) onNo(); };
        const cleanup = () => {
            yesBtn.removeEventListener('click', onYes);
            noBtn.removeEventListener('click', onNo);
            document.removeEventListener('keydown', onKeydown, true);
            dialog.removeEventListener('click', onBackdrop);
        };
        yesBtn.addEventListener('click', onYes);
        noBtn.addEventListener('click', onNo);
        document.addEventListener('keydown', onKeydown, true);
        dialog.addEventListener('click', onBackdrop);
        yesBtn.focus();
    });
}

function _findConfirm() {
    if (window.parent === window) return null;
    let w = window.parent;
    while (w) {
        try {
            if (w.showConfirmDialog && w.showConfirmDialog !== window.showConfirmDialog)
                return w.showConfirmDialog.bind(w);
        } catch (e) { break; }
        if (w === w.parent) break;
        w = w.parent;
    }
    return null;
}

function _loadAvatar(uid, imgEl) {
    const DEFAULT = '/common/resource/img/default-avatar.svg';
    function applyTo(el, uri) {
        el.src = uri || DEFAULT;

    if (_avatarCache[uid] !== undefined) {

// ---- column helpers ----

function _normalizeListColumns(raw) {
    if (!raw || !raw.length) return [{ id: '@created_at', width: '' }];
    return raw.map(c => (typeof c === 'string') ? { id: c, width: '' } : c);
}

function _resolveWidths(cols) {
    const restIdx = cols.findIndex(c => c.width === 'rest' || c.width === 'auto');
    const fixed = cols.filter((_, i) => i !== restIdx).map(c => parseFloat(c.width) || 0);
    const usedPct = fixed.reduce((a, b) => a + b, 0);
    return cols.map((c, i) => {
        if (i === restIdx) return `${Math.max(0, 100 - usedPct)}%`;
        const n = parseFloat(c.width);
        return isNaN(n) ? '' : `${n}%`;
    });
}

const _SYS_COL_LABELS = {
    ko: { '@record_id': '레코드ID', '@row_id': '번호', '@created_at': '생성일시', '@updated_at': '수정일시', '@author': '작성자' },
    en: { '@record_id': 'Record ID', '@row_id': 'No', '@created_at': 'Created At', '@updated_at': 'Updated At', '@author': 'Author' },
};

function _colLabel(col, fieldLabels) {
    const sysLabels = _SYS_COL_LABELS[_currentLang] || _SYS_COL_LABELS.en;
    if (col.startsWith('@')) return sysLabels[col] !== undefined ? sysLabels[col] : col;
    return (fieldLabels && fieldLabels[col] !== undefined) ? fieldLabels[col] : col;
}

function _escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---- DOM measurement ----

// Measure header height and one data row height by rendering a hidden probe table.
// Uses actual DOM geometry so font, line-height, padding, border changes are all absorbed.
async function _measureRowHeight(containerEl, cols, fieldLabels) {
    if (document.fonts && document.fonts.ready) {
        // Wait for web fonts so glyph metrics are final before measuring.
        await document.fonts.ready;
    }
    const colHtml = cols.map((c, i) => {
        const w = _resolveWidths(cols)[i];
        return `<th${w ? ` style="width:${w}"` : ''}>${_colLabel(c.id, fieldLabels)}</th>`;
    }).join('');
    // Use mixed Latin+Hangul content to get the tallest possible glyph height.
    // For @author columns, include the avatar markup too. Otherwise small font
    // sizes underestimate the real row height because actual rows always have
    // an 18px avatar there.
    const cellHtml = cols.map(c => {
        if (c.id === '@author') {
            return '<td><span class="sfr-author-cell">'
                + '<span class="sfr-author-avatar-wrap">'
                + '<img class="sfr-author-avatar" alt="" aria-hidden="true" '
                + 'src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">'
                + '</span>Mg가</span></td>';
        }
        return '<td>Mg가</td>';
    }).join('');
    const probe = document.createElement('div');
    probe.style.cssText = 'visibility:hidden;position:absolute;left:-9999px;top:0;'
        + 'width:' + containerEl.clientWidth + 'px;pointer-events:none;';
    probe.innerHTML = '<table class="sfr-board-table" style="table-layout:fixed;width:100%">'
        + '<thead><tr>' + colHtml + '</tr></thead>'
        + '<tbody><tr>' + cellHtml + '</tr></tbody>'
        + '</table>';
    containerEl.appendChild(probe);
    const headerH = probe.querySelector('thead').getBoundingClientRect().height;
    const rowH    = probe.querySelector('tbody tr').getBoundingClientRect().height;
    containerEl.removeChild(probe);
    return { headerH: Math.ceil(headerH), rowH: Math.ceil(rowH) };
}

// Measure the fixed chrome at the bottom (new-btn + pagination bar).
// Called after those elements exist in the DOM.
function _measureChromeHeight(containerEl) {
    let h = 0;
    const newBtn = containerEl.querySelector('.sfr-board-new-btn');
    if (newBtn) h += newBtn.getBoundingClientRect().height
                  + parseFloat(getComputedStyle(newBtn).marginTop || 0);
    const pager = containerEl.querySelector('.sfr-board-pager');
    if (pager) h += pager.getBoundingClientRect().height
                 + parseFloat(getComputedStyle(pager).marginTop || 0);
    return Math.ceil(h);
}

// Compute how many data rows fit in containerEl given measured dimensions.
// Keep a small pixel slack for sub-pixel rounding, but do not always drop a
// whole row. Row height measurement already includes the author avatar now.
function _computePageSize(containerH, headerH, rowH, chromeH) {
    const avail = containerH - headerH - chromeH - 2;
    return Math.max(1, Math.floor(avail / rowH));
}

// ---- load + render ----

async function _loadBoardData(fieldDef, containerEl) {
    const prev = _boardFields.find(b => b.id === fieldDef.id);
    if (prev && prev._resizeObserver) prev._resizeObserver.disconnect();
    _boardFields = _boardFields.filter(b => b.id !== fieldDef.id);
    const langAtStart = _currentLang;
    const detailPath = fieldDef.detailFormPath || '';

    // Fetch field labels in parallel; defer record fetch until page size is known.
    const fieldsRes = detailPath
        ? await callPython('board_read_detail_fields', { path: detailPath }).catch(() => null)
        : null;
    const fieldLabels = {};
    const optionMaps = {};  // fieldId → { canonicalValue: displayLabel }
    if (fieldsRes && fieldsRes.fields) {
        fieldsRes.fields.forEach(f => {
            fieldLabels[f.id] = _loc(f, 'label');
            const opts = f.options;
            const locOpts = _loc(f, 'options');
            if (Array.isArray(opts) && Array.isArray(locOpts)) {
                const map = {};
                opts.forEach((v, i) => { map[v] = locOpts[i] !== undefined ? locOpts[i] : v; });
                optionMaps[f.id] = map;
            }
        });
    }

    const cols = _normalizeListColumns(fieldDef.listColumns);

    // Measure row height before fetching records so we know the page size.
    const { headerH, rowH } = await _measureRowHeight(containerEl, cols, fieldLabels);

    // Estimate chrome height using placeholder elements (rendered off-screen).
    // We need to know chrome height before we can compute page size, but chrome
    // itself contains the pagination bar whose height depends on font metrics.
    // Solution: measure a dummy chrome once, then use that height for all pages.
    const chromeH = await _estimateChromeHeight(containerEl, fieldDef);

    const pageSize = _computePageSize(containerEl.clientHeight, headerH, rowH, chromeH);

    const restoredPage = _savedBoardPages[fieldDef.id] || 1;
    const entry = { id: fieldDef.id, fieldDef, containerEl, fieldLabels, optionMaps, pageSize, currentPage: restoredPage, total: 0 };
    _boardFields.push(entry);

    await _fetchAndRender(entry, restoredPage);

    // If language changed while we were loading (race with setLanguage postMessage), reload.
    if (_currentLang !== langAtStart) {
        _loadBoardData(fieldDef, containerEl);
        return;
    }

    // Attach ResizeObserver to recompute page size when board container resizes.
    if (typeof ResizeObserver !== 'undefined') {
        const ro = new ResizeObserver(() => _onBoardResize(entry));
        ro.observe(containerEl);
        entry._resizeObserver = ro;
    }
}

async function _estimateChromeHeight(containerEl, fieldDef) {
    // Measure chrome height using a worst-case skeleton (max pager buttons)
    // so that the computed pageSize is never over-estimated regardless of
    // how many pages end up being needed.
    const probe = document.createElement('div');
    probe.style.cssText = 'visibility:hidden;position:absolute;left:-9999px;top:0;'
        + 'width:' + containerEl.clientWidth + 'px;pointer-events:none;';
    // Worst-case: << < … 1 2 3 … > >> = 9 elements; use this width for measurement
    // so flex-wrap wrapping on narrow containers is captured.
    const pager = document.createElement('div');
    pager.className = 'sfr-board-pager';
    ['<<', '<', '…', '1', '2', '3', '…', '>', '>>'].forEach(label => {
        if (label === '…') {
            const gap = document.createElement('span');
            gap.className = 'sfr-board-pager-gap';
            gap.textContent = label;
            pager.appendChild(gap);
        } else {
            const b = document.createElement('button');
            b.className = 'sfr-board-pager-btn';
            b.textContent = label;
            pager.appendChild(b);
        }
    });
    probe.appendChild(pager);
    if (fieldDef.detailFormPath) {
        const btn = document.createElement('button');
        btn.className = 'sfr-board-new-btn';
        const btnImg = document.createElement('img');
        btnImg.src = 'icon-new-post.svg';
        btnImg.className = 'sfr-board-new-btn-icon';
        btnImg.alt = '';
        btn.appendChild(btnImg);
        btn.appendChild(document.createTextNode(' ' + (_currentLang === 'ko' ? '새 글' : 'New Post')));
        if (fieldDef._cellW) btn.style.width = (fieldDef._cellW * 2) + 'px';
        probe.appendChild(btn);
    }
    containerEl.appendChild(probe);
    const h = _measureChromeHeight(probe);
    containerEl.removeChild(probe);
    return h;
}

async function _fetchAndRender(entry, page) {
    const { fieldDef, containerEl, fieldLabels, pageSize } = entry;
    const detailPath = fieldDef.detailFormPath || '';
    const offset = (page - 1) * pageSize;
    const res = await callPython('board_list', {
        detail_form_path: detailPath,
        board_id: fieldDef.id,
        offset,
        limit: pageSize,
        permission: fieldDef.permission || null,
    }).catch(() => null);
    if (res && res.group_not_found) {
        entry.total = 0;
        entry.currentPage = page;
        entry.permFlags = { can_read: false, can_write: false, can_comment: false, can_modify: false };
        _renderBoardGroupNotFound(entry, res.group_id, res.group_name);
        return;
    }
    if (res && res.permission_denied) {
        entry.total = 0;
        entry.currentPage = page;
        entry.permFlags = { can_read: false, can_write: false, can_comment: false, can_modify: false };
        _renderBoardDenied(entry);
        return;
    }
    entry.total = (res && res.total != null) ? res.total : 0;
    entry.currentPage = page;
    entry.permFlags = (res && res.flags) ? res.flags : null;
    _renderBoardTable(entry, res ? res.records : []);
}

function _renderBoardDenied(entry) {
    const { containerEl } = entry;
    const msg = _currentLang === 'ko' ? '권한이 없습니다.' : 'Access denied.';
    containerEl.innerHTML = `<div style="padding:20px;text-align:center;opacity:0.6;font-size:13px">${msg}</div>`;
}

function _renderBoardGroupNotFound(entry, groupId, groupName) {
    const { containerEl } = entry;
    const label = groupName || groupId || '';
    const idPart = groupId ? ` (id: ${groupId})` : '';
    const msg = _currentLang === 'ko'
        ? `그룹을 찾을 수 없습니다: ${label}${idPart}`
        : `Group not found: ${label}${idPart}`;
    containerEl.innerHTML = `<div style="padding:20px;text-align:center;opacity:0.6;font-size:13px">${msg}</div>`;
}

function _renderBoardTable(entry, records) {
    const { fieldDef, containerEl, fieldLabels, optionMaps, pageSize, currentPage, total } = entry;
    const permFlags = entry.permFlags || null;
    const cols    = _normalizeListColumns(fieldDef.listColumns);
    const widths  = _resolveWidths(cols);
    const totalPages = Math.max(1, Math.ceil(total / pageSize));

    let html = '<table class="sfr-board-table" style="table-layout:fixed;width:100%"><thead><tr>';
    cols.forEach((c, i) => {
        const w = widths[i] ? ` style="width:${widths[i]}"` : '';
        html += `<th${w}>${_colLabel(c.id, fieldLabels)}</th>`;
    });
    html += '</tr></thead><tbody>';
    if (!records.length) {
        html += `<tr><td colspan="${cols.length}" style="padding:12px;opacity:0.5;text-align:center">-</td></tr>`;
    }
    const authorIdByRid = {};
    records.forEach(rec => {
        const rid = rec['@record_id'] || '';
        const sel = (rid && rid === currentRecordId) ? ' class="sfr-board-row-selected"' : '';
        html += `<tr data-rid="${rid}" style="cursor:pointer"${sel}>`;
        cols.forEach(c => {
            let v = rec[c.id] !== undefined ? rec[c.id] : '';
            if (c.id === '@created_at' || c.id === '@updated_at') {
                const fmt = _formatBoardDateTime(v);
                if (fmt.full) {
                    html += `<td><span data-sfr-tip="${_escHtml(fmt.full)}">${_escHtml(fmt.display)}</span></td>`;
                } else {
                    html += `<td>${_escHtml(fmt.display)}</td>`;
                }
                return;
            }
            if (c.id === '@author') {
                const authorId = rec['@author_id'] || '';
                const authorName = _escHtml(String(rec['@author'] || authorId || ''));
                if (authorId) authorIdByRid[rid] = authorId;
                html += `<td><span class="sfr-author-cell" data-uid="${_escHtml(authorId)}"><span class="sfr-author-avatar-wrap"><img class="sfr-author-avatar" src="" alt="" aria-hidden="true"></span>${authorName}</span></td>`;
                return;
            }
            if (optionMaps && optionMaps[c.id] && optionMaps[c.id][v] !== undefined) v = optionMaps[c.id][v];
            const cmtCount = (c.width === 'rest') ? (rec['@comment_count'] || 0) : 0;
            if (cmtCount > 0) {
                html += `<td class="sfr-td-rest"><div class="sfr-td-rest-inner"><span class="sfr-td-rest-text">${_escHtml(String(v))}</span><span class="sfr-cmt-count">[${cmtCount}]</span></div></td>`;
            } else {
                html += `<td>${_escHtml(String(v))}</td>`;
            }
        });
        html += '</tr>';
    });
    html += '</tbody></table>';

    containerEl.innerHTML = html;

    // Load avatars asynchronously after DOM insertion
    const authorCells = containerEl.querySelectorAll('.sfr-author-cell[data-uid]');
    if (authorCells.length) {
        authorCells.forEach(cell => {
            const uid = cell.dataset.uid;
            if (!uid) return;
            const img = cell.querySelector('.sfr-author-avatar');
            _loadAvatar(uid, img);
        });
    }

    containerEl.querySelectorAll('tr[data-rid]').forEach(tr => {
        tr.addEventListener('click', () => {
            const rid = tr.dataset.rid;
            if (!rid) return;
            _boardNavToDetail(rid, fieldDef);
        });
    });

    // Spacer pushes chrome to the bottom regardless of row count.
    const spacer = document.createElement('div');
    spacer.className = 'sfr-board-spacer';
    containerEl.appendChild(spacer);

    // Bottom chrome: pagination on top, new-btn below
    const chrome = document.createElement('div');
    chrome.className = 'sfr-board-chrome';

    if (totalPages > 1) {
        const pager = _buildPager(entry, currentPage, totalPages);
        chrome.appendChild(pager);
    }

    const canWrite = !permFlags || permFlags.can_write;
    if (fieldDef.detailFormPath && canWrite) {
        const newBtn = document.createElement('button');
        newBtn.className = 'sfr-board-new-btn';
        const newBtnImg = document.createElement('img');
        newBtnImg.src = 'icon-new-post.svg';
        newBtnImg.className = 'sfr-board-new-btn-icon';
        newBtnImg.alt = '';
        newBtn.appendChild(newBtnImg);
        newBtn.appendChild(document.createTextNode(' ' + (_currentLang === 'ko' ? '새 글' : 'New Post')));
        if (fieldDef._cellW) newBtn.style.width = (fieldDef._cellW * 2) + 'px';
        newBtn.addEventListener('click', () => _boardNavToDetail(null, fieldDef));
        chrome.appendChild(newBtn);
    }

    containerEl.appendChild(chrome);
}

function _formatBoardDateTime(value) {
    const raw = String(value || '').trim();
    if (!raw) return '';

    const isUtc = /Z$/.test(raw);
    const normalized = raw.replace('T', ' ').replace(/Z$/, '');
    const m = normalized.match(/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}):(\d{2}):(\d{2}))?/);
    if (!m) return normalized;

    const [, year, month, day, hour = '00', minute = '00', second = '00'] = m;
    const dt = isUtc
        ? new Date(Date.UTC(Number(year), Number(month) - 1, Number(day), Number(hour), Number(minute), Number(second)))
        : new Date(Number(year), Number(month) - 1, Number(day), Number(hour), Number(minute), Number(second));
    if (Number.isNaN(dt.getTime())) return normalized;

    const now = new Date();
    const isToday = dt.getFullYear() === now.getFullYear()
        && dt.getMonth() === now.getMonth()
        && dt.getDate() === now.getDate();

    const pad = n => String(n).padStart(2, '0');
    const full = `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}:${pad(dt.getSeconds())}`;
    if (isToday) return { display: `${pad(dt.getHours())}:${pad(dt.getMinutes())}:${pad(dt.getSeconds())}`, full: null };
    return { display: `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`, full };
}

// Shared tooltip element — created once, positioned via JS to avoid overflow:hidden clipping
const _sfrTipEl = document.createElement('div');
_sfrTipEl.className = 'sfr-tip-box';
_sfrTipEl.style.display = 'none';
document.body.appendChild(_sfrTipEl);

document.addEventListener('mouseover', function(e) {
    const target = e.target.closest('[data-sfr-tip]');
    if (!target) return;
    const tip = target.getAttribute('data-sfr-tip');
    if (!tip) return;
    _sfrTipEl.textContent = tip;
    _sfrTipEl.style.display = '';
    const r = target.getBoundingClientRect();
    const tw = _sfrTipEl.offsetWidth;
    let left = r.left + r.width / 2 - tw / 2;
    if (left < 4) left = 4;
    if (left + tw > window.innerWidth - 4) left = window.innerWidth - 4 - tw;
    _sfrTipEl.style.left = left + 'px';
    _sfrTipEl.style.top = (r.top - _sfrTipEl.offsetHeight - 5) + 'px';
}, true);

    const target = e.target.closest('[data-sfr-tip]');
    if (!target) return;
    if (!target.contains(e.relatedTarget)) {
        _sfrTipEl.style.display = 'none';
    }
}, true);

let _avatarPreviewTimer = null;

function _showAvatarPreview(wrap, uid) {
    const PREVIEW_SIZE = 64;

    function positionAndShow(src) {
        if (!src) return;
        _avatarPreviewEl.src = src;
        _avatarPreviewEl.style.display = 'block';
        // Convert wrap coords from iframe-local to parent viewport coords.
        const avatarWrapEl = wrap.querySelector('.sfr-author-avatar-wrap');
        const ra = (avatarWrapEl || wrap).getBoundingClientRect();
        let iframeOffsetX = 0, iframeOffsetY = 0;
        try {
            const fe = window.frameElement;
            if (fe) {
                const ir = fe.getBoundingClientRect();
                iframeOffsetX = ir.left;
                iframeOffsetY = ir.top;
            }
        } catch(e) {}
        const avatarCenterX = ra.left + ra.width  / 2 + iframeOffsetX;
        const avatarCenterY = ra.top  + ra.height / 2 + iframeOffsetY;
        const vw = (_avatarPreviewDoc.documentElement || {}).clientWidth  || window.innerWidth;
        const vh = (_avatarPreviewDoc.documentElement || {}).clientHeight || window.innerHeight;
        let left = avatarCenterX - PREVIEW_SIZE / 2;
        let top  = avatarCenterY - PREVIEW_SIZE / 2;
        if (left < 4) left = 4;
        if (left + PREVIEW_SIZE > vw - 4) left = vw - 4 - PREVIEW_SIZE;
        if (top  < 4) top  = 4;
        if (top  + PREVIEW_SIZE > vh - 4) top  = vh - 4 - PREVIEW_SIZE;
        _avatarPreviewEl.style.left = left + 'px';
        _avatarPreviewEl.style.top  = top  + 'px';
    }

    if (_avatarCacheFull[uid] !== undefined) {
        if (_avatarCacheFull[uid] !== 'loading') positionAndShow(_avatarCacheFull[uid]);
        return;
    }
    _avatarCacheFull[uid] = 'loading';
    callPython('get_account_photo', { user_id: uid, size: 'full' }).then(r => {
        const uri = (r && r.data_uri) || _avatarCache[uid] || null;
        _avatarCacheFull[uid] = uri;
        positionAndShow(uri);
    }).catch(() => {
        const fallback = _avatarCache[uid] || null;
        _avatarCacheFull[uid] = fallback;
        positionAndShow(fallback);
    });
}

document.addEventListener('mouseover', function(e) {
    const cell = e.target.closest('.sfr-author-cell');
    if (!cell) return;
    const uid = cell.dataset.uid;
    if (!uid) return;
    clearTimeout(_avatarPreviewTimer);
    _avatarPreviewTimer = setTimeout(() => _showAvatarPreview(cell, uid), 250);
}, true);

document.addEventListener('mouseout', function(e) {
    const cell = e.target.closest('.sfr-author-cell');
    if (!cell) return;
    if (!cell.contains(e.relatedTarget)) {
        clearTimeout(_avatarPreviewTimer);
        _avatarPreviewEl.style.display = 'none';
    }
}, true);

function _buildPager(entry, currentPage, totalPages) {
    const pager = document.createElement('div');
    pager.className = 'sfr-board-pager';

    const addBtn = (label, page, disabled) => {
        const btn = document.createElement('button');
        btn.className = 'sfr-board-pager-btn' + (page === currentPage ? ' sfr-board-pager-btn-active' : '');
        btn.textContent = label;
        btn.disabled = disabled;
        if (!disabled) {
            btn.addEventListener('click', () => _fetchAndRender(entry, page));
        }
        pager.appendChild(btn);
    };

    // Window of page buttons: show up to 5 around currentPage
    const WINDOW = 2;
    const first = Math.max(1, currentPage - WINDOW);
    const last  = Math.min(totalPages, currentPage + WINDOW);

    addBtn('<<', 1, currentPage === 1);
    addBtn('<', currentPage - 1, currentPage === 1);
    if (first > 1) {
        const gap = document.createElement('span');
        gap.className = 'sfr-board-pager-gap';
        gap.textContent = '…';
        pager.appendChild(gap);
    }
    for (let p = first; p <= last; p++) addBtn(String(p), p, false);
    if (last < totalPages) {
        const gap = document.createElement('span');
        gap.className = 'sfr-board-pager-gap';
        gap.textContent = '…';
        pager.appendChild(gap);
    }
    addBtn('>', currentPage + 1, currentPage === totalPages);
    addBtn('>>', totalPages, currentPage === totalPages);

    return pager;
}

// Called by ResizeObserver when the board container changes size.
// Re-measures row height and reloads the current page if page size changed.
async function _onBoardResize(entry) {
    const { containerEl, fieldDef, fieldLabels } = entry;
    const cols = _normalizeListColumns(fieldDef.listColumns);
    const { headerH, rowH } = await _measureRowHeight(containerEl, cols, fieldLabels);
    const chromeH = await _estimateChromeHeight(containerEl, fieldDef);
    const newPageSize = _computePageSize(containerEl.clientHeight, headerH, rowH, chromeH);
    if (newPageSize !== entry.pageSize) {
        entry.pageSize = newPageSize;
        // Jump to page 1 when page size changes to avoid out-of-range pages.
        await _fetchAndRender(entry, 1);
    }
}

function _applyDetailButtonState(isMine, flags) {
    // isMine: true = existing record owned by current user
    //         false = existing record owned by someone else
    //         null = new record (rid was null)
    // flags: resolved permission flags from server (or null = no restriction)
    const canWrite   = !flags || flags.can_write;
    const canModify  = !flags || flags.can_modify;
    document.querySelectorAll('[data-board-command]').forEach(btn => {
        const cmd = btn.dataset.boardCommand;
        let enabled;
        if (isMine === null) {
            // new record: POST only if user can write
            enabled = (cmd === 'LIST') || (cmd === 'POST' && canWrite);
        } else {
            // existing record: LIST always
            // MODIFY/DELETE: mine (author) OR admin with canModify
            const canEdit = isMine || canModify;
            enabled = (cmd === 'LIST') || ((cmd === 'MODIFY' || cmd === 'DELETE') && canEdit);
        }
        btn.disabled = !enabled;
    });
}

// Stored permission of the board field currently shown in detail view
let _currentBoardPermission = null;

async function _boardNavToDetail(rid, fieldDef) {
    clearTimeout(_avatarPreviewTimer);
    _avatarPreviewEl.style.display = 'none';
    _sfrTipEl.style.display = 'none';

    const detailPath = fieldDef.detailFormPath || '';
    if (!detailPath) return;

    const permission = fieldDef.permission || null;
    _currentBoardPermission = permission;

    const tasks = [callPython('runner_load_schema', { path: detailPath, is_board_detail: true }).catch(() => null)];
    if (rid) tasks.push(callPython('board_get', { record_id: rid, detail_form_path: detailPath, permission }).catch(() => null));

    const results = await Promise.all(tasks);
    const schemaRes = results[0];
    const recordRes = rid ? results[1] : null;

    if (!schemaRes || !schemaRes.success || !schemaRes.schema) return;

    if (recordRes && recordRes.group_not_found) {
        const label = recordRes.group_name || recordRes.group_id || '';
        const idPart = recordRes.group_id ? ` (id: ${recordRes.group_id})` : '';
        const msg = _currentLang === 'ko'
            ? `그룹을 찾을 수 없습니다: ${label}${idPart}`
            : `Group not found: ${label}${idPart}`;
        await showConfirmDialog(msg, '', { yesStyle: 'secondary', hideCancelBtn: true }).catch(() => {});
        return;
    }
    if (recordRes && recordRes.permission_denied) {
        const msg = _currentLang === 'ko' ? '권한이 없습니다.' : 'Access denied.';
        await showConfirmDialog(msg, '', { yesStyle: 'secondary', hideCancelBtn: true }).catch(() => {});
        return;
    }

    _listSchema = currentSchema;
    currentRecordId = rid || null;

    // Propagate list form theme to detail form so invert/dark/light is consistent.
    if (currentSchema && currentSchema.docProps && currentSchema.docProps.theme) {
        schemaRes.schema.docProps = schemaRes.schema.docProps || {};
        schemaRes.schema.docProps.theme = currentSchema.docProps.theme;
    }

    // Save current page for each board field so we can restore it on back.
    _savedBoardPages = {};
    _boardFields.forEach(b => { _savedBoardPages[b.id] = b.currentPage; });

    // Determine edit permission before rendering so fields can be forced readonly.
    const _flags  = (recordRes && recordRes.flags) || null;
    const _isMine = rid ? !!(recordRes && recordRes.is_mine) : null;
    const _canWrite  = !_flags || _flags.can_write;
    const _canModify = !_flags || _flags.can_modify;
    const _canEdit   = _isMine === null ? _canWrite : (_isMine || _canModify);
    if (!_canEdit) {
        (schemaRes.schema.fields || []).forEach(f => { f.readonly = true; });
    }

    renderForm(schemaRes.schema);
    if (rid) {
        const record = recordRes && recordRes.record;
        if (record) {
            applySetValues(record);
            _applyInfoRecord(record);
        }
        _applyDetailButtonState(_isMine, _flags);
    } else {
        _applyDetailButtonState(null, null);
        callPython('get_current_user_info', {}).then(info => {
            if (!info) return;
            _applyInfoRecord({ '@author_id': info.user_id, '@author': info.display_name });
            if (info.data_uri) {
                _avatarCache[info.user_id] = info.data_uri;
                document.querySelectorAll(`.sfr-author-avatar[data-pending-uid="${CSS.escape(info.user_id)}"]`).forEach(el => {
                    delete el.dataset.pendingUid;
                    el.src = info.data_uri;
                    el.style.display = '';
                });
            }
        }).catch(() => {});
    }
    _detailInitialValues = Object.assign({}, formValues);
}

function boardNavBack() {
    if (!_listSchema) return;
    const schema = _listSchema;
    _listSchema = null;
    currentRecordId = null;
    _detailInitialValues = null;
    // _savedBoardPages is consumed by _loadBoardData during renderForm; clear after.
    renderForm(schema);
    _savedBoardPages = {};
}

function _refreshAllBoards() {
    _boardFields.forEach(b => _loadBoardData(b.fieldDef, b.containerEl));
}

// ================================================================
// SET VALUES (from caller via TCP → Python state_update → JS)
// ================================================================
function applySetValues(values) {
    if (!currentSchema || !values) return;
    currentSchema.fields.forEach(f => {
        if (!(f.id in values)) return;
        const val = values[f.id];
        const el = document.getElementById('sfr-' + f.id);
        if (!el) return;
        if (f.type === 'checkbox') {
            el.checked = !!val;
            formValues[f.id] = !!val;
        } else if (f.type === 'toggle') {
            el.checked = !!val;
            formValues[f.id] = !!val;
        } else if (f.type === 'number') {
            el.value = val;
            formValues[f.id] = Number(val);
        } else {
            el.value = val;
            formValues[f.id] = val;
            if (el._refreshMdPreview) el._refreshMdPreview();
        }
    });
}

function _applyInfoRecord(record) {
    _infoFields.forEach(function(entry) {
        var fid = entry.el.dataset.infoField || '@author';

        if (fid === '@author') {
            var authorId = record ? (record['@author_id'] || '') : '';
            var authorName = record ? (record['@author'] || authorId || '') : '';
            var nameSpan = entry.el.querySelector('.sfr-info-author-name');
            if (nameSpan) nameSpan.textContent = authorName;
            entry.el.style.opacity = record ? '' : '0.5';
            var img = entry.el.querySelector('.sfr-author-avatar');
            if (img) {
                if (authorId) {
                    _loadAvatar(authorId, img);
                } else {
                    img.src = '/common/resource/img/default-avatar.svg';
                }
            }
            return;
        }

        var v = '';
        if (record) {
            v = record[fid] !== undefined ? record[fid] : '';
            if (fid === '@created_at' || fid === '@updated_at') {
                var fmt = _formatBoardDateTime(String(v));
                v = (fmt && typeof fmt === 'object') ? (fmt.full || fmt.display) : (fmt || String(v));
            }
        }
        entry.el.value = String(v);
        entry.el.style.opacity = record ? '' : '0.5';
    });
}

let _lastSetValuesSeq = -1;
window.state_update = function(updates) {};

// Poll for set_values updates from caller (avoids Qt cross-thread callJS issue)
async function _pollSetValues() {
    try {
        const state = await callPython('runner_get_state', {});
        if (state && state.set_values_seq !== undefined && state.set_values_seq !== _lastSetValuesSeq) {
            _lastSetValuesSeq = state.set_values_seq;
            applySetValues(state.set_values);
        }
    } catch(e) {}
    setTimeout(_pollSetValues, 300);
}
setTimeout(_pollSetValues, 500);
