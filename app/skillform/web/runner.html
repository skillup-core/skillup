function _cmtBuildTree(comments) {
    const map = {};
    const roots = [];
    comments.forEach(c => { map[c.id] = { ...c, children: [] }; });
    comments.forEach(c => {
        if (c.parent_id && map[c.parent_id]) {
            map[c.parent_id].children.push(map[c.id]);
        } else {
            roots.push(map[c.id]);
        }
    });
    return roots;
}

function _cmtRenderComment(c, currentUser) {
    const displayName = c.display_name || c.user_id;
    const initials = displayName.substring(0, 2).toUpperCase();
    const avatarHtml = c.avatar_small && c.avatar_small.length > 0
        ? `<img src="data:${c.avatar_mime || 'image/jpeg'};base64,${c.avatar_small}" alt="${_cmtEsc(displayName)}" class="sfr-cmt-avatar-img">`
        : `<span class="sfr-cmt-avatar-initials">${_cmtEsc(initials)}</span>`;
    const canEdit = c.user_id === currentUser;
    const _perm = _currentBoardPermission;
    const canComment = !_perm || !_perm.comment || _perm.comment.member !== false;
    const repliesHtml = c.children && c.children.length
        ? `<div class="sfr-cmt-replies">${c.children.map(ch => _cmtRenderComment(ch, currentUser)).join('')}</div>`
        : '';
    return `<div class="sfr-cmt-item" data-cmt-id="${c.id}">
        <div class="sfr-cmt-avatar">${avatarHtml}</div>
        <div class="sfr-cmt-body">
            <div class="sfr-cmt-meta">
                <span class="sfr-cmt-user">${_cmtEsc(displayName)}</span>
                <span class="sfr-cmt-time">${_cmtEsc(_cmtFormatTime(c.created_at))}</span>
                <div class="sfr-cmt-actions">
                    ${canComment ? `<button class="sfr-cmt-btn sfr-cmt-reply-btn">${_cmtEsc(_cmtT('reply'))}</button>` : ''}
                    ${canEdit ? `<button class="sfr-cmt-btn sfr-cmt-edit-btn">${_cmtEsc(_cmtT('edit'))}</button>` : ''}
                    ${canEdit ? `<button class="sfr-cmt-btn sfr-cmt-del-btn">${_cmtEsc(_cmtT('delete'))}</button>` : ''}
                </div>
            </div>
            <div class="sfr-cmt-content sfr-cmt-md" data-raw="${_cmtEsc(c.content)}">${_cmtRenderMd(c.content)}</div>
            <div class="sfr-cmt-edit-area" style="display:none">
                <textarea class="sfr-cmt-input" rows="2"></textarea>
                <div class="sfr-cmt-side-btns">
                    <button class="sfr-cmt-btn sfr-cmt-primary-btn sfr-cmt-edit-save-btn">${_cmtEsc(_cmtT('save'))}</button>
                    <button class="sfr-cmt-btn sfr-cmt-edit-cancel-btn">${_cmtEsc(_cmtT('cancel'))}</button>
                </div>
            </div>
            <div class="sfr-cmt-reply-area" style="display:none">
                <textarea class="sfr-cmt-input" rows="2" placeholder="${_cmtEsc(_cmtT('replyPlaceholder'))}"></textarea>
                <div class="sfr-cmt-side-btns">
                    <button class="sfr-cmt-btn sfr-cmt-primary-btn sfr-cmt-reply-post-btn">${_cmtEsc(_cmtT('reply'))}</button>
                    <button class="sfr-cmt-btn sfr-cmt-reply-cancel-btn">${_cmtEsc(_cmtT('cancel'))}</button>
                </div>
            </div>
            ${repliesHtml}
        </div>
    </div>`;
}

async function _renderCommentComponent(fieldDef, containerEl) {
    containerEl._cmtFieldDef = fieldDef;

    if (!currentRecordId) {
        containerEl.innerHTML = '';
        // Trigger layout to hide the wrap and reflow fields below
        const layout = _commentLayouts.find(l => l.fieldDef.id === fieldDef.id);
        if (layout) _applyCommentLayout(layout);
        return;
    }

    await _loadComments(fieldDef, containerEl);
    // Trigger layout after content is loaded so height is correct
    const layout = _commentLayouts.find(l => l.fieldDef.id === fieldDef.id);
    if (layout) _applyCommentLayout(layout);

}

async function _loadComments(fieldDef, containerEl) {
    const rid = currentRecordId;
    const detailFormPath = fieldDef.commentDetailFormPath || '';

    try {
        const res = await callPython('comment_list', { record_id: rid, detail_form_path: detailFormPath });
        const comments = (res && res.success && res.comments) ? res.comments : [];
        const currentUser = (res && res.current_user) ? res.current_user : '';

        const roots = _cmtBuildTree(comments);
        const listHtml = roots.length
            ? roots.map(c => _cmtRenderComment(c, currentUser)).join('')
            : `<div class="sfr-cmt-empty">${_cmtEsc(_cmtT('noComments'))}</div>`;

        const _perm = _currentBoardPermission;
        const showNewArea = !_perm || !_perm.comment || _perm.comment.member !== false;

        containerEl.innerHTML = `
            ${roots.length ? `<div class="sfr-cmt-list">${listHtml}</div>` : ''}
            ${showNewArea ? `<div class="sfr-cmt-new-area${roots.length ? ' sfr-cmt-new-area--has-list' : ''}">
                <textarea class="sfr-cmt-input" id="sfr-cmt-new-${fieldDef.id}" rows="2" placeholder="${_cmtEsc(_cmtT('placeholder'))}"></textarea>
                <button class="sfr-cmt-btn sfr-cmt-primary-btn sfr-cmt-new-post-btn">${_cmtEsc(_cmtT('post'))}</button>
            </div>` : ''}
        `;

        _setupCommentListeners(fieldDef, containerEl, rid, currentUser, detailFormPath);
    } catch(e) {
        containerEl.innerHTML = '';
    }
}

function _setupCommentListeners(fieldDef, containerEl, rid, currentUser, detailFormPath) {
    const _confirm = showConfirmDialog;

    // Auto-resize on all textareas
    containerEl.querySelectorAll('textarea.sfr-cmt-input').forEach(ta => {
        ta.addEventListener('input', () => _cmtAutoResize(ta));
        _cmtAutoResize(ta);
    });

    // New top-level comment
    const newPostBtn = containerEl.querySelector('.sfr-cmt-new-post-btn');
    const newInput = containerEl.querySelector(`#sfr-cmt-new-${fieldDef.id}`);
    if (newPostBtn && newInput) {
        const doPost = async () => {
            const content = newInput.value.trim();
            if (!content) return;
            await callPython('comment_add', { record_id: rid, detail_form_path: detailFormPath, content, parent_id: null, permission: _currentBoardPermission || null });
            await _loadComments(fieldDef, containerEl);
        };
        newPostBtn.addEventListener('click', doPost);
        newInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); doPost(); }
        });
    }

    // Per-comment actions
    containerEl.querySelectorAll('.sfr-cmt-item').forEach(itemEl => {
        const cid = itemEl.dataset.cmtId;

        // Reply toggle
        const replyBtn = itemEl.querySelector(':scope > .sfr-cmt-body > .sfr-cmt-meta .sfr-cmt-reply-btn');
        const replyArea = itemEl.querySelector(':scope > .sfr-cmt-body > .sfr-cmt-reply-area');
        if (replyBtn && replyArea) {
            let _replyOutsideHandler = null;
            function _closeReplyArea() {
                replyArea.style.display = 'none';
                if (_replyOutsideHandler) {
                    document.removeEventListener('mousedown', _replyOutsideHandler, true);
                    _replyOutsideHandler = null;
                }
            }
            replyBtn.addEventListener('click', () => {
                const opening = replyArea.style.display === 'none';
                replyArea.style.display = opening ? '' : 'none';
                if (opening) {
                    const ta = replyArea.querySelector('textarea');
                    if (ta) { ta.focus(); _cmtAutoResize(ta); }
                    if (_replyOutsideHandler) document.removeEventListener('mousedown', _replyOutsideHandler, true);
                    _replyOutsideHandler = function(e) {
                        if (!replyArea.contains(e.target) && e.target !== replyBtn) {
                            _closeReplyArea();
                        }
                    };
                    setTimeout(() => document.addEventListener('mousedown', _replyOutsideHandler, true), 0);
                } else {
                    if (_replyOutsideHandler) {
                        document.removeEventListener('mousedown', _replyOutsideHandler, true);
                        _replyOutsideHandler = null;
                    }
                }
            });
            const replyPostBtn = replyArea.querySelector('.sfr-cmt-reply-post-btn');
            const replyInput = replyArea.querySelector('textarea');
            if (replyPostBtn && replyInput) {
                const doReply = async () => {
                    const content = replyInput.value.trim();
                    if (!content) return;
                    await callPython('comment_add', { record_id: rid, detail_form_path: detailFormPath, content, parent_id: parseInt(cid), permission: _currentBoardPermission || null });
                    await _loadComments(fieldDef, containerEl);
                };
                replyPostBtn.addEventListener('click', doReply);
                replyInput.addEventListener('keydown', e => {
                    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); doReply(); }
                });
            }
            const replyCancelBtn = replyArea.querySelector('.sfr-cmt-reply-cancel-btn');
            if (replyCancelBtn) replyCancelBtn.addEventListener('click', () => { _closeReplyArea(); });
        }

        // Edit toggle
        const editBtn = itemEl.querySelector(':scope > .sfr-cmt-body > .sfr-cmt-meta .sfr-cmt-edit-btn');
        const editArea = itemEl.querySelector(':scope > .sfr-cmt-body > .sfr-cmt-edit-area');
        const contentEl = itemEl.querySelector(':scope > .sfr-cmt-body > .sfr-cmt-content');
        if (editBtn && editArea && contentEl) {
            const openEdit = () => {
                contentEl.style.display = 'none';
                editArea.style.display = '';
                const ta = editArea.querySelector('textarea');
                if (ta) {
                    ta.value = contentEl.dataset.raw || '';
                    ta.focus();
                    _cmtAutoResize(ta);
                }
            };
            const closeEdit = () => {
                editArea.style.display = 'none';
                contentEl.style.display = '';
            };
            editBtn.addEventListener('click', openEdit);
            const editSaveBtn = editArea.querySelector('.sfr-cmt-edit-save-btn');
            const editInput = editArea.querySelector('textarea');
            if (editSaveBtn && editInput) {
                const doSave = async () => {
                    const content = editInput.value.trim();
                    if (!content) return;
                    await callPython('comment_update', { comment_id: parseInt(cid), detail_form_path: detailFormPath, content });
                    await _loadComments(fieldDef, containerEl);
                };
                editSaveBtn.addEventListener('click', doSave);
                editInput.addEventListener('keydown', e => {
                    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); doSave(); }
                });
            }
            const editCancelBtn = editArea.querySelector('.sfr-cmt-edit-cancel-btn');
            if (editCancelBtn) editCancelBtn.addEventListener('click', closeEdit);
        }

        // Delete
        const delBtn = itemEl.querySelector(':scope > .sfr-cmt-body > .sfr-cmt-meta .sfr-cmt-del-btn');
        if (delBtn) {
            delBtn.addEventListener('click', async () => {
                const ok = await _confirm('', _cmtT('confirmDelete'), { yesStyle: 'danger' });
                if (!ok) return;
                await callPython('comment_delete', { comment_id: parseInt(cid), detail_form_path: detailFormPath });
                await _loadComments(fieldDef, containerEl);
            });
        }
    });
}

// Apply dynamic height layout for a comment component.
// Recomputes every field's top from scratch using each comment's current rendered height.
// Comment fields grow with content and push all fields on the same row or below downward.
function _applyCommentLayout(layout) {
    const { fieldDef: f, wrapEl, gridRowH, formEl, allFieldEls } = layout;
    const fieldEl = wrapEl.closest('.sfr-field');
    if (!fieldEl) return;

    const isMdField = f.type === 'textarea' && f.markdown !== false;

    if (isMdField) {
        // markdown textarea: always visible, height driven by preview content (set by ResizeObserver)
        fieldEl.style.display = '';
    } else {
        const hidden = !currentRecordId;
        if (hidden) {
            fieldEl.style.display = 'none';
        } else {
            fieldEl.style.display = '';
            fieldEl.style.height = 'auto';  // shrink-wrap to content; offsetHeight used for push calc
        }
    }

    // Read the inter-field gap from CSS (--sfr-dynamic-field-gap on .sfr-form).
    const fieldGap = parseInt(getComputedStyle(formEl).getPropertyValue('--sfr-dynamic-field-gap'), 10) || 0;

    // Build a map of schema row -> rendered comment height.
    const commentHeights = {}; // row -> rendered px height
    _commentLayouts.forEach(cl => {
        const cEl = cl.wrapEl.closest('.sfr-field');
        if (!cEl || cEl.style.display === 'none') { commentHeights[cl.fieldDef.row] = 0; return; }
        // Prefer explicit style.height (set by us); fall back to offsetHeight for auto-height elements.
        const styleH = parseFloat(cEl.style.height);
        commentHeights[cl.fieldDef.row] = (!isNaN(styleH) && styleH > 0) ? styleH : (cEl.offsetHeight || 0);
    });

    // Sort dynamic layout rows ascending so gap counting is deterministic.
    const dynRows = _commentLayouts
        .map(cl => cl.fieldDef.row)
        .filter(r => (commentHeights[r] || 0) > 0)
        .sort((a, b) => a - b);

    // Reposition every field from its schema row.
    // Each dynamic field at row C with rendered height rendH and schema height allocH:
    //   - pushes same-row non-dynamic fields (row == C) down by rendH + gap
    //   - pushes fields strictly below (row > C) down by (rendH - allocH) + gap
    //   - dynamic field itself: pushed by sum of (extra + gap) of all dynamic fields above it
    allFieldEls.forEach(el => {
        const fieldRow  = parseInt(el.dataset.fieldRow, 10);
        if (isNaN(fieldRow)) return;
        const isComment = el.querySelector('.sfr-comment-wrap, .sfr-md-wrap') !== null;

        let push = 0;
        if (isComment) {
            // Dynamic fields above this one each contribute (extra + gap).
            _commentLayouts.forEach(cl => {
                if (cl.fieldDef.row < fieldRow) {
                    const rendH  = commentHeights[cl.fieldDef.row] || 0;
                    const allocH = cl.fieldDef.h * gridRowH;
                    const extra  = Math.max(0, rendH - allocH);
                    push += extra + (rendH > 0 ? fieldGap : 0);
                }
            });
        } else {
            _commentLayouts.forEach(cl => {
                const rendH  = commentHeights[cl.fieldDef.row] || 0;
                const allocH = cl.fieldDef.h * gridRowH;
                if (cl.fieldDef.row === fieldRow) {
                    push += rendH + (rendH > 0 ? fieldGap : 0);
                } else if (cl.fieldDef.row < fieldRow) {
                    const extra = Math.max(0, rendH - allocH);
                    push += extra + (rendH > 0 ? fieldGap : 0);
                }
            });
        }

        const newTop = fieldRow * gridRowH + 16 + push; // 16 = MARGIN
        el.style.top = newTop + 'px';
    });

    // Expand formEl to fit all fields.
    let newMinH = 0;
    allFieldEls.forEach(el => {
        const top = parseFloat(el.style.top) || 0;
        const h   = el.style.height === 'auto' ? el.offsetHeight : (parseFloat(el.style.height) || 0);
        newMinH = Math.max(newMinH, top + h);
    });
    formEl.style.minHeight = (newMinH + 16) + 'px';

    // Resize the iframe in the parent modal to match expanded content.
    try {
        if (window.parent && window.parent !== window && window.parent.desktopModal) {
            var iframeEl = window.parent.document.querySelector('#desktop-modal-body iframe');
            if (iframeEl) {
                iframeEl.style.height = (newMinH + 16) + 'px';
            }
        }
    } catch(e) {}

    // Standalone (run) mode: resize Qt window to fit expanded content.
    if (_isStandaloneMode) {
        var _expandedW = parseFloat(formEl.style.minWidth) || 300;
        _standaloneResizeWindow(Math.max(_expandedW, 300), Math.max(newMinH + 16, 150));
    }
}

// Refresh all comment components (called after POST to get currentRecordId)
function _refreshCommentComponents() {
    document.querySelectorAll('.sfr-comment-wrap').forEach(el => {
        const fieldEl = el.closest('.sfr-field');
        if (fieldEl) fieldEl.style.display = '';  // ensure visible after POST
        const fd = el._cmtFieldDef;
        if (fd) _renderCommentComponent(fd, el);
        // Layout is triggered inside _renderCommentComponent via _applyCommentLayout
    });
}

// ================================================================
// STANDALONE MODE
// ================================================================
let _isStandaloneMode = false;

function _standaloneResizeWindow(w, h) {
    var maxH = Math.floor(screen.availHeight * 0.8);
    var capped = h > maxH;
    var finalH = capped ? maxH : h;
    // When content exceeds max height, enable body scroll so content is reachable.
    document.body.style.overflowY = capped ? 'auto' : '';
    var rootEl = document.querySelector('.sfr-root');
    if (rootEl) rootEl.style.overflowY = capped ? 'auto' : '';
    callPython('resize_window', { w: w, h: finalH }).catch(function() {});
}

function initStandaloneMode(state) {
    if (!state || !state.auto_run) return;
    _isStandaloneMode = true;
}

// ================================================================
// APPINIT CALLBACKS
// ================================================================
window.getAppStateAction = () => 'runner_get_state';

// skillform manages its own theme via renderForm (schema.docProps.theme)
// Prevent common.js initStandaloneSettings from overriding it with desktop theme
window.skillformNoStandaloneTheme = true;

window.onAppStateLoaded = function(state) {
    if (state && state.auto_run_lang) _currentLang = state.auto_run_lang;
    initStandaloneMode(state);
    const urlSchemaPath = new URLSearchParams(window.location.search).get('schema_path');
    if (urlSchemaPath) {
        callPython('runner_load_schema', { path: urlSchemaPath }).then(function(res) {
            if (res && res.success && res.schema) {
                renderForm(res.schema);
            }
        });
        return;
    }
    if (state && state.schema) {
        renderForm(state.schema);
    }
};

async function onViewActivated() {
    // When tab is switched to Runner, check if designer pushed a schema
    const state = await callPython('runner_get_state', {});
    if (state && state.schema && state.waiting) {
        renderForm(state.schema);
        setStatus('', '');
    }
}
function onLanguageChange(lang) {
    _currentLang = lang || 'en';
    _refreshAllBoards();
    _refreshCommentComponents();
}


// ================================================================
// WEB BROWSER MOCK
// ================================================================
if (typeof isInWebBrowser !== 'undefined' && isInWebBrowser) {
    setTimeout(function() {
        renderForm({
            docProps: { formName: "Sample Form", fontSize: 14 },
            grid: { cols: 12, rowHeight: 48 },
            fields: [
                { id:'name',  type:'text',     label:'이름',   col:0, row:0, w:6, h:1, required:true },
                { id:'cell',  type:'text',     label:'Cell',   col:6, row:0, w:6, h:1 },
                { id:'drc',   type:'checkbox', label:'Run DRC', col:0, row:1, w:4, h:1 },
                { id:'layer', type:'dropdown', label:'Layer',   col:4, row:1, w:4, h:1, options:['M1','M2','Poly'], default:'M1' },
                { id:'cnt',   type:'number',   label:'Count',   col:8, row:1, w:4, h:1, default:1 },
                { id:'note',  type:'textarea', label:'Note',    col:0, row:2, w:12,h:2 },
            ]
        });
    }, 200);
}
</script>
