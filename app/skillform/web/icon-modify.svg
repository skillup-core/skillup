<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none">
  <!-- Paper -->
  <rect x="3" y="2" width="10" height="13" rx="1.5"
        fill="#000" fill-opacity="0.08" stroke="#000" stroke-width="1.3"/>
  <!-- Pencil shaft -->
  <rect x="10.5" y="9.5" width="6.5" height="2.2" rx="0.5"
        fill="#000" fill-opacity="0.82"
        transform="rotate(-45 10.5 9.5)"/>
  <!-- Pencil tip -->
  <polygon points="8.2,16.2 9.5,14.9 10.8,16.2 9.5,17.5"
           fill="#000" fill-opacity="0.55"/>
  <!-- Point -->
  <polygon points="9.1,17.1 9.9,17.1 9.5,17.9"
           fill="#000" fill-opacity="0.35"/>
  <!-- Eraser -->
  <rect x="14.8" y="6.5" width="2.0" height="1.6" rx="0.4"
        fill="#000" fill-opacity="0.45"
        transform="rotate(-45 14.8 6.5)"/>
</svg>
