<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none">
  <!-- Trash can body -->
  <rect x="4.5" y="7" width="11" height="10" rx="1.5"
        fill="#000" fill-opacity="0.08" stroke="#000" stroke-width="1.3"/>
  <!-- Lid -->
  <line x1="2.5" y1="7" x2="17.5" y2="7" stroke="#000" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Handle -->
  <path d="M7.5 7 V5.5 Q7.5 4 10 4 Q12.5 4 12.5 5.5 V7"
        stroke="#000" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <!-- Vertical lines inside -->
  <line x1="8.5"  y1="9.5" x2="8.5"  y2="14.5" stroke="#000" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="10"   y1="9.5" x2="10"   y2="14.5" stroke="#000" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="11.5" y1="9.5" x2="11.5" y2="14.5" stroke="#000" stroke-width="1.1" stroke-linecap="round"/>
</svg>
